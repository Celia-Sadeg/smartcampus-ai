<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant IA - SmartCampus AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <h1 class="title"><a href="/" class="home-link">SmartCampus AI</a></h1>
    <p class="subtitle">Assistant IA</p>
  </header>

  <main class="main main-wide">
    <div class="panel chat-panel">
      <div id="chat" class="chat"></div>
      <form id="chat-form" class="chat-form">
        <input type="text" id="question" placeholder="Votre question..." autocomplete="off" />

      </form>
    </div>
  </main>

  <footer class="footer"><p>US-04 - Interroger l'assistant IA</p></footer>
  <script src="/assistant.js"></script>
</body>
</html>
