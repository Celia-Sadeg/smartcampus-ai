<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signaler un incident - SmartCampus AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <h1 class="title"><a href="/" class="home-link">SmartCampus AI</a></h1>
    <p class="subtitle">Signaler un incident</p>
  </header>

  <main class="main">
    <form id="incident-form" class="form" novalidate>
      <div class="field">
        <label for="categorie">Categorie *</label>
        <select id="categorie" name="categorie" required>
          <option value="">-- Choisir une categorie --</option>
        </select>
        <p class="error" id="error-categorie"></p>
      </div>

      <div class="field">
        <label for="lieu">Lieu *</label>
        <input type="text" id="lieu" name="lieu" placeholder="ex : B204" required />
        <p class="error" id="error-lieu"></p>
      </div>

      <div class="field">
        <label for="description">Description *</label>
        <textarea id="description" name="description" rows="4"
          placeholder="Decrivez le probleme..." required></textarea>
        <p class="error" id="error-description"></p>
      </div>

      <div class="field">
        <label for="photo">Photo (JPG/PNG, optionnel)</label>
        <input type="file" id="photo" name="photo" accept="image/png, image/jpeg" />
        <p class="hint">La photo sera geree dans une prochaine etape (stockage S3).</p>
      </div>

      <button type="submit" class="action-btn submit-btn">Valider le signalement</button>
    </form>
  </main>

  <footer class="footer">
    <p>US-01 - Signaler un incident</p>
  </footer>

  <script src="/signaler.js"></script>
</body>
</html>
